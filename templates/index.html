<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>黄金 LangChain 分析系统</title>
    <style>
        :root {
            --bg: #f5efe3;
            --panel: rgba(255, 250, 241, 0.92);
            --border: #e7d6b5;
            --text: #2f2417;
            --subtle: #786650;
            --accent: #9b6b16;
            --accent-dark: #724c09;
            --up: #1d7a43;
            --down: #b42318;
            --flat: #b8700c;
            --unknown: #667085;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: "Microsoft YaHei", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top left, rgba(255, 214, 102, 0.22), transparent 26%),
                linear-gradient(180deg, #faf6ee 0%, var(--bg) 100%);
        }
        .container {
            width: min(1160px, calc(100% - 28px));
            margin: 22px auto 40px;
        }
        .hero, .panel {
            background: var(--panel);
            backdrop-filter: blur(6px);
            border: 1px solid var(--border);
            border-radius: 22px;
            box-shadow: 0 16px 50px rgba(89, 61, 19, 0.08);
        }
        .hero { padding: 28px; }
        .hero-top, .status-row, .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: space-between;
            align-items: center;
        }
        .title { margin: 0; font-size: 34px; }
        .subtitle, .meta { color: var(--subtle); }
        button, a.button-link {
            border: none;
            border-radius: 999px;
            padding: 12px 20px;
            cursor: pointer;
            text-decoration: none;
            font-size: 15px;
            transition: transform 0.15s ease;
        }
        button:hover, a.button-link:hover { transform: translateY(-1px); }
        .primary { background: var(--accent); color: #fff; }
        .secondary { background: rgba(155, 107, 22, 0.12); color: var(--accent-dark); }
        .stats, .trend-summary, .grid { display: grid; gap: 16px; }
        .stats {
            margin-top: 18px;
            grid-template-columns: repeat(3, minmax(0, 1fr));
        }
        .stat-card, .mini-card {
            background: rgba(255, 247, 230, 0.9);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 16px;
        }
        .stat-label { color: var(--subtle); font-size: 13px; }
        .stat-value { margin-top: 8px; font-size: 28px; font-weight: 700; }
        .grid {
            margin-top: 20px;
            grid-template-columns: 1.25fr 1fr;
        }
        .panel { padding: 22px; }
        .section-title { margin: 0 0 14px; font-size: 20px; }
        .badge {
            display: inline-flex;
            align-items: center;
            border-radius: 999px;
            color: #fff;
            padding: 6px 12px;
            font-size: 13px;
            font-weight: 700;
        }
        .trend-up { background: var(--up); }
        .trend-down { background: var(--down); }
        .trend-flat { background: var(--flat); }
        .trend-unknown { background: var(--unknown); }
        .status-success { background: #166534; }
        .status-partial { background: #b45309; }
        .status-failed { background: #991b1b; }
        .content-block { margin-bottom: 18px; line-height: 1.8; }
        ul { margin: 8px 0 0; padding-left: 18px; }
        .chart {
            position: relative;
            height: 300px;
            border-radius: 16px;
            border: 1px solid var(--border);
            background: linear-gradient(180deg, rgba(255, 241, 204, 0.7), rgba(255, 250, 241, 0.95));
            padding: 12px;
        }
        canvas { width: 100%; height: 100%; }
        .trend-summary {
            margin-top: 16px;
            grid-template-columns: repeat(4, minmax(0, 1fr));
        }
        .loading {
            min-height: 24px;
            color: var(--accent-dark);
            font-weight: 700;
            margin-top: 14px;
        }
        @media (max-width: 920px) {
            .grid { grid-template-columns: 1fr; }
            .stats, .trend-summary { grid-template-columns: 1fr 1fr; }
        }
        @media (max-width: 560px) {
            .container { width: calc(100% - 18px); }
            .hero, .panel { padding: 16px; }
            .stats, .trend-summary { grid-template-columns: 1fr; }
            .title { font-size: 27px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <section class="hero">
            <div class="hero-top">
                <div>
                    <h1 class="title">黄金 LangChain 分析系统</h1>
                    <p class="subtitle">行情抓取、结构化分析、历史看板和可追溯记录统一收口。</p>
                </div>
                <div class="actions">
                    <button id="analyzeBtn" class="primary">手动执行分析</button>
                    <a class="button-link secondary" href="/records">查看历史记录</a>
                </div>
            </div>

            <div class="stats">
                <div class="stat-card">
                    <div class="stat-label">当前金价</div>
                    <div id="price" class="stat-value">--</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">当前时间</div>
                    <div id="liveTime" class="stat-value" style="font-size:18px;">--</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">最新状态</div>
                    <div id="latestStatus" class="stat-value" style="font-size:18px;">--</div>
                </div>
            </div>
            <div id="loading" class="loading"></div>
        </section>

        <div class="grid">
            <section class="panel">
                <h2 class="section-title">最新分析结果</h2>
                <div id="resultMeta" class="meta">暂无数据</div>
                <div class="status-row" style="margin-top:14px;">
                    <span id="trendBadge" class="badge trend-unknown">未知</span>
                    <span id="statusBadge" class="badge status-failed">未执行</span>
                </div>

                <div class="content-block">
                    <strong>新闻摘要</strong>
                    <div id="summary">暂无总结</div>
                </div>

                <div class="content-block">
                    <strong>相关新闻</strong>
                    <ul id="newsList"></ul>
                </div>

                <div class="content-block">
                    <strong>原因分析</strong>
                    <ul id="reasonList"></ul>
                </div>

                <div class="content-block">
                    <strong>操作建议</strong>
                    <div id="advice">暂无建议</div>
                </div>

                <div class="content-block">
                    <strong>错误信息</strong>
                    <div id="errorText">无</div>
                </div>
            </section>

            <section class="panel">
                <h2 class="section-title">近 24 条趋势看板</h2>
                <div class="chart">
                    <canvas id="priceChart"></canvas>
                </div>
                <div class="trend-summary">
                    <div class="mini-card">
                        <div class="stat-label">上涨</div>
                        <div id="trendUp" class="stat-value" style="font-size:24px;">0</div>
                    </div>
                    <div class="mini-card">
                        <div class="stat-label">下跌</div>
                        <div id="trendDown" class="stat-value" style="font-size:24px;">0</div>
                    </div>
                    <div class="mini-card">
                        <div class="stat-label">震荡</div>
                        <div id="trendFlat" class="stat-value" style="font-size:24px;">0</div>
                    </div>
                    <div class="mini-card">
                        <div class="stat-label">失败 / 部分失败</div>
                        <div id="statusSummary" class="stat-value" style="font-size:24px;">0</div>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <script>
        function unwrap(response) {
            if (!response.success) {
                throw new Error(response.error || "请求失败");
            }
            return response.data;
        }

        function updateLiveTime() {
            const now = new Date();
            document.getElementById("liveTime").innerText = now.getFullYear() + "-" +
                String(now.getMonth() + 1).padStart(2, "0") + "-" +
                String(now.getDate()).padStart(2, "0") + " " +
                String(now.getHours()).padStart(2, "0") + ":" +
                String(now.getMinutes()).padStart(2, "0") + ":" +
                String(now.getSeconds()).padStart(2, "0");
        }

        function applyBadge(element, text, mapping, fallbackClass) {
            element.innerText = text;
            element.className = "badge " + (mapping[text] || fallbackClass);
        }

        function renderList(elementId, values, emptyText, mapper) {
            const element = document.getElementById(elementId);
            element.innerHTML = "";
            if (!values || values.length === 0) {
                const item = document.createElement("li");
                item.innerText = emptyText;
                element.appendChild(item);
                return;
            }
            values.forEach((value) => {
                const item = document.createElement("li");
                item.innerText = mapper ? mapper(value) : value;
                element.appendChild(item);
            });
        }

        function renderRecord(record) {
            if (!record) {
                return;
            }
            document.getElementById("price").innerText = record.price_raw || "--";
            document.getElementById("summary").innerText = record.summary || "暂无总结";
            document.getElementById("advice").innerText = record.advice || "暂无建议";
            document.getElementById("errorText").innerText = record.error || "无";
            document.getElementById("resultMeta").innerText =
                `时间：${record.time || "--"} ｜ 来源：${record.source || "--"} ｜ 模型：${record.model_name || "--"}`;
            document.getElementById("latestStatus").innerText = record.status || "--";

            applyBadge(document.getElementById("trendBadge"), record.trend || "未知", {
                "上涨": "trend-up",
                "下跌": "trend-down",
                "震荡": "trend-flat",
                "未知": "trend-unknown"
            }, "trend-unknown");

            applyBadge(document.getElementById("statusBadge"), record.status || "failed", {
                "success": "status-success",
                "partial": "status-partial",
                "failed": "status-failed"
            }, "status-failed");

            renderList("newsList", record.news || [], "暂无相关新闻", (item) => item.title);
            renderList("reasonList", record.reasons || [], "暂无原因");
        }

        function drawPriceChart(points) {
            const canvas = document.getElementById("priceChart");
            const ctx = canvas.getContext("2d");
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * window.devicePixelRatio;
            canvas.height = rect.height * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
            ctx.clearRect(0, 0, rect.width, rect.height);

            const validPoints = points.filter((point) => typeof point.price === "number");
            if (validPoints.length < 2) {
                ctx.fillStyle = "#786650";
                ctx.font = "14px Microsoft YaHei";
                ctx.fillText("历史价格数据不足，暂时无法绘图。", 16, 30);
                return;
            }

            const padding = 28;
            const width = rect.width - padding * 2;
            const height = rect.height - padding * 2;
            const prices = validPoints.map((point) => point.price);
            const minPrice = Math.min(...prices);
            const maxPrice = Math.max(...prices);
            const range = Math.max(maxPrice - minPrice, 1);

            ctx.strokeStyle = "#d9c39b";
            ctx.lineWidth = 1;
            for (let i = 0; i < 4; i += 1) {
                const y = padding + (height / 3) * i;
                ctx.beginPath();
                ctx.moveTo(padding, y);
                ctx.lineTo(padding + width, y);
                ctx.stroke();
            }

            ctx.strokeStyle = "#9b6b16";
            ctx.lineWidth = 2;
            ctx.beginPath();
            validPoints.forEach((point, index) => {
                const x = padding + (width / (validPoints.length - 1)) * index;
                const y = padding + height - ((point.price - minPrice) / range) * height;
                if (index === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            });
            ctx.stroke();

            ctx.fillStyle = "#786650";
            ctx.font = "12px Microsoft YaHei";
            ctx.fillText(`最低 ${minPrice.toFixed(2)}`, padding, rect.height - 8);
            ctx.fillText(`最高 ${maxPrice.toFixed(2)}`, rect.width - padding - 82, 18);
        }

        async function loadGoldPrice() {
            try {
                const response = await fetch("/api/price");
                const payload = unwrap(await response.json());
                document.getElementById("price").innerText = payload.price_raw || "--";
            } catch (error) {
                document.getElementById("price").innerText = "--";
            }
        }

        async function loadDashboard() {
            const loading = document.getElementById("loading");
            try {
                const response = await fetch("/api/dashboard/summary?limit=24");
                const data = unwrap(await response.json());
                if (data.latest) {
                    renderRecord(data.latest);
                }
                const trendCounts = data.trend_counts || {};
                const statusCounts = data.status_counts || {};
                document.getElementById("trendUp").innerText = trendCounts["上涨"] || 0;
                document.getElementById("trendDown").innerText = trendCounts["下跌"] || 0;
                document.getElementById("trendFlat").innerText = trendCounts["震荡"] || 0;
                document.getElementById("statusSummary").innerText =
                    (statusCounts["partial"] || 0) + (statusCounts["failed"] || 0);
                drawPriceChart(data.price_points || []);
                loading.innerText = "";
            } catch (error) {
                loading.innerText = "看板加载失败";
            }
        }

        async function runAnalysis() {
            const loading = document.getElementById("loading");
            loading.innerText = "正在执行分析，请稍候...";
            try {
                const response = await fetch("/api/analysis/run", { method: "POST" });
                const record = unwrap(await response.json());
                renderRecord(record);
                await loadDashboard();
                loading.innerText = "分析完成";
                setTimeout(() => { loading.innerText = ""; }, 2000);
            } catch (error) {
                loading.innerText = error.message || "分析请求失败";
            }
        }

        document.getElementById("analyzeBtn").addEventListener("click", runAnalysis);
        updateLiveTime();
        setInterval(updateLiveTime, 1000);
        loadGoldPrice();
        setInterval(loadGoldPrice, 10000);
        loadDashboard();
    </script>
</body>
</html>
