<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>黄金分析历史记录</title>
    <style>
        :root {
            --bg: #f7f1e6;
            --panel: rgba(255, 250, 241, 0.94);
            --border: #e6d6b8;
            --text: #2f2417;
            --subtle: #7b6a58;
            --accent: #9b6b16;
            --danger: #b42318;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: "Microsoft YaHei", sans-serif;
            color: var(--text);
            background: linear-gradient(180deg, #fbf6ee 0%, var(--bg) 100%);
        }
        .container {
            width: min(1080px, calc(100% - 28px));
            margin: 24px auto 40px;
        }
        .header, .record-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 22px;
            box-shadow: 0 16px 50px rgba(89, 61, 19, 0.08);
        }
        .header {
            padding: 24px;
            margin-bottom: 18px;
        }
        h1 { margin: 0 0 8px; }
        .subtle { color: var(--subtle); }
        .toolbar, .record-header, .actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
        }
        button, a {
            border: none;
            border-radius: 999px;
            padding: 10px 18px;
            text-decoration: none;
            cursor: pointer;
            font-size: 14px;
        }
        .primary {
            background: rgba(155, 107, 22, 0.12);
            color: var(--accent);
        }
        .danger {
            background: rgba(180, 35, 24, 0.12);
            color: var(--danger);
        }
        .record-card {
            padding: 18px 20px;
            margin-bottom: 14px;
        }
        .record-title {
            font-size: 22px;
            font-weight: 700;
        }
        .meta {
            color: var(--subtle);
            margin-top: 6px;
        }
        .badge {
            display: inline-flex;
            padding: 6px 12px;
            border-radius: 999px;
            color: #fff;
            font-size: 12px;
            font-weight: 700;
            margin-left: 8px;
        }
        .up { background: #1d7a43; }
        .down { background: #b42318; }
        .flat { background: #b8700c; }
        .unknown { background: #667085; }
        .success { background: #166534; }
        .partial { background: #b45309; }
        .failed { background: #991b1b; }
        .record-detail {
            display: none;
            margin-top: 16px;
            border-top: 1px solid var(--border);
            padding-top: 16px;
        }
        .section { margin-top: 12px; }
        .section-title { font-weight: 700; margin-bottom: 8px; }
        ul { margin: 8px 0 0; padding-left: 18px; }
        .empty {
            text-align: center;
            padding: 28px;
            color: var(--subtle);
        }
        @media (max-width: 640px) {
            .container { width: calc(100% - 18px); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>黄金分析历史记录</h1>
            <div class="subtle">最近 20 条结构化分析记录，可查看详情或删除。</div>
            <div class="toolbar" style="margin-top: 16px;">
                <a class="primary" href="/">返回首页</a>
                <button class="primary" onclick="loadRecords()">刷新记录</button>
            </div>
        </div>

        <div id="recordList" class="empty">加载中...</div>
    </div>

    <script>
        function unwrap(response) {
            if (!response.success) {
                throw new Error(response.error || "请求失败");
            }
            return response.data;
        }

        function trendClass(trend) {
            return {
                "上涨": "up",
                "下跌": "down",
                "震荡": "flat",
                "未知": "unknown"
            }[trend] || "unknown";
        }

        function statusClass(status) {
            return {
                "success": "success",
                "partial": "partial",
                "failed": "failed"
            }[status] || "failed";
        }

        function toggleDetail(id) {
            const element = document.getElementById(id);
            element.style.display = element.style.display === "block" ? "none" : "block";
        }

        async function deleteRecord(recordId) {
            if (!confirm("确定要删除这条记录吗？")) {
                return;
            }
            try {
                const response = await fetch(`/api/records/${recordId}`, { method: "DELETE" });
                const result = await response.json();
                if (!result.success) {
                    throw new Error(result.error || "删除失败");
                }
                alert(result.data.message);
                loadRecords();
            } catch (error) {
                alert(error.message || "删除请求失败");
            }
        }

        async function loadRecords() {
            const container = document.getElementById("recordList");
            container.innerHTML = "加载中...";
            try {
                const response = await fetch("/api/records/latest?n=20");
                const records = unwrap(await response.json());
                if (!records || records.length === 0) {
                    container.innerHTML = '<div class="empty">暂无历史记录</div>';
                    return;
                }
                container.innerHTML = records.map((record, index) => `
                    <div class="record-card">
                        <div class="record-header">
                            <div>
                                <div class="record-title">金价 ${record.price_raw || "--"}</div>
                                <div class="meta">
                                    ${record.time || "--"} ｜ ${record.source || "--"} ｜ ${record.model_name || "--"}
                                    <span class="badge ${trendClass(record.trend)}">${record.trend || "未知"}</span>
                                    <span class="badge ${statusClass(record.status)}">${record.status || "failed"}</span>
                                </div>
                            </div>
                            <div class="actions">
                                <button class="primary" onclick="toggleDetail('detail-${index}')">展开 / 收起</button>
                                <button class="danger" onclick="deleteRecord('${record.id}')">删除</button>
                            </div>
                        </div>

                        <div id="detail-${index}" class="record-detail">
                            <div class="section">
                                <div class="section-title">新闻摘要</div>
                                <div>${record.summary || "暂无总结"}</div>
                            </div>

                            <div class="section">
                                <div class="section-title">相关新闻</div>
                                <ul>${(record.news || []).map((item) => `<li>${item.title}</li>`).join("") || "<li>暂无相关新闻</li>"}</ul>
                            </div>

                            <div class="section">
                                <div class="section-title">原因分析</div>
                                <ul>${(record.reasons || []).map((item) => `<li>${item}</li>`).join("") || "<li>暂无原因</li>"}</ul>
                            </div>

                            <div class="section">
                                <div class="section-title">操作建议</div>
                                <div>${record.advice || "暂无建议"}</div>
                            </div>

                            <div class="section">
                                <div class="section-title">错误信息</div>
                                <div>${record.error || "无"}</div>
                            </div>
                        </div>
                    </div>
                `).join("");
            } catch (error) {
                container.innerHTML = `<div class="empty">${error.message || "历史记录加载失败"}</div>`;
            }
        }

        loadRecords();
    </script>
</body>
</html>
